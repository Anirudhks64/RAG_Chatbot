[project]
name = "exp-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chainlit>=2.12.0",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "google-genai>=2.29.0",
    "groq>=1.7.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-text-splitters>=1.1.3",
    "ollama>=0.6.3",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "trafilatura>=2.3.1",
]

[project.scripts]
exp-rag = "exp_rag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
